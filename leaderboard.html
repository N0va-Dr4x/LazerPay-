<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lazer Pay - Leaderboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 0; }
    nav {
      background: #111;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 50px;
      border-bottom: 1px solid #444;
    }
    nav button {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    h1 { text-align: center; margin: 20px 0; }
    table {
      width: 90%;
      margin: 0 auto;
      border-collapse: collapse;
      color: #fff;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #444;
    }
    th { background: #222; }
  </style>
</head>
<body>
  <nav>
    <button onclick="location.href='game.html'">Play</button>
    <button onclick="location.href='leaderboard.html'">Leaderboard</button>
    <button onclick="location.href='payout.html'">Payout</button>
    <button onclick="logout()">Logout</button>
  </nav>

  <h1>Top LMS Holders</h1>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Username</th>
        <th>Email</th>
        <th>LMS Balance</th>
      </tr>
    </thead>
    <tbody id="leaderboard"></tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
    import { firebaseConfig } from './firebase.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();
    const tbody = document.getElementById('leaderboard');

    function logout() {
      signOut(auth);
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.href = 'index.html';

      const snapshot = await getDocs(collection(db, 'users'));
      const users = [];

      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.username && typeof data.lms === 'number') {
          users.push({
            username: data.username,
            email: data.email,
            lms: data.lms
          });
        }
      });

      users.sort((a, b) => b.lms - a.lms);

      users.forEach((u, i) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${i + 1}</td>
          <td>${u.username}</td>
          <td>${maskEmail(u.email)}</td>
          <td>${u.lms.toFixed(4)}</td>
        `;
        tbody.appendChild(row);
      });
    });

    function maskEmail(email) {
      const [name, domain] = email.split('@');
      const hidden = name.slice(0, 2) + '*'.repeat(name.length - 2);
      return hidden + '@' + domain;
    }
  </script>
</body>
</html>
